name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-lint:
    name: shellcheck + shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sudo curl -fsSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 \
            -o /usr/local/bin/shfmt
          sudo chmod +x /usr/local/bin/shfmt
      - name: shellcheck (errors only - gate)
        run: |
          set -e
          mapfile -t files < <(git ls-files '*.sh')
          echo "Linting ${#files[@]} shell files at error level…"
          for f in "${files[@]}"; do
            echo "→ $f"
            shellcheck -S error "$f"
          done
      - name: shellcheck (warnings - advisory)
        if: always()
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          fails=0
          for f in "${files[@]}"; do
            if ! out=$(shellcheck -S warning "$f" 2>&1); then
              echo "::warning::$f has shellcheck findings"
              echo "$out" | head -40
              fails=$((fails + 1))
            fi
          done
          echo "Files with warnings: $fails"
      - name: shfmt --check
        run: shfmt -d -i 4 -ci $(git ls-files '*.sh')

  python-compile:
    name: python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile on bot sources
        run: |
          set -e
          mapfile -t files < <(find bots -name '*.py')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Python files."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "→ $f"
            python -m py_compile "$f"
          done

  smoke:
    name: unit tests (no external deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: bash tools/tests/run-tests.sh
      - name: Run tests with TAP output
        if: always()
        run: bash tools/tests/run-tests.sh --tap | tail -50
